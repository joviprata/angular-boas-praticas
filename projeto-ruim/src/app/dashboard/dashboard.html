<div class="min-h-screen font-sans flex flex-col bg-fixed bg-cover bg-center" 
     style="background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=100&w=4000&auto=format&fit=crop');">
  
  <div class="min-h-screen w-full bg-black/10 p-5 flex-1">
    
    <header class="mb-5">
      <h1 class="flex items-center gap-3 text-2xl font-bold text-white drop-shadow-lg">
        Dashboard Corporativo 
        <span class="text-[10px] bg-red-500 text-white px-2 py-1 rounded tracking-wider uppercase font-bold shadow-md">PROJETO RUIM</span>
      </h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-5">
      
      <section class="bg-white/95 p-5 rounded-xl shadow-2xl border border-white/20 flex flex-col h-[750px]">
        <h3 class="text-lg font-bold text-slate-800 mb-3 shrink-0 text-center">⏱️ Bate-Ponto Ao Vivo</h3>
        <div class="overflow-y-auto flex-1 pr-2">
          <ul class="flex flex-col">
            <li *ngFor="let evento of eventosAoVivo" 
                class="p-3 border-b border-slate-100 text-sm text-slate-600 first:font-bold first:text-green-600">
              {{ evento }}
            </li>
          </ul>
        </div>
      </section>

      <div class="flex flex-col gap-5">
        
        <section class="bg-white/95 p-5 rounded-xl shadow-2xl border border-white/20">
          <h3 class="text-lg font-bold text-slate-800">👥 Quadro de Colaboradores (5.000 registros)</h3>

          <div class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-4 mt-5 h-[450px] overflow-y-auto pr-2">
            <div class="flex items-center gap-4 p-4 border border-slate-100 rounded-xl bg-white shadow-sm" 
                 *ngFor="let colab of colaboradores">
              
              <img src="https://picsum.photos/1000/1000?random={{colab.id}}" alt="Avatar" class="w-12 h-12 rounded-full shrink-0 shadow-sm object-cover">

              <div>
                <h4 class="font-bold text-slate-700 m-0 mb-1 leading-tight">{{ colab.nome }}</h4>
                <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">{{ colab.departamento }}</span>
                <p class="text-xs text-orange-500 mt-2 font-bold">Tempo de Casa: {{ colab.anosEmpresa }} anos</p>
              </div>
            </div>
          </div>
        </section>

        <section class="bg-white/95 p-5 rounded-xl shadow-2xl border border-white/20">
          <h3 class="text-lg font-bold text-slate-800 mb-6">📊 Distribuição Salarial</h3>
          <div class="flex items-end gap-6 h-48 w-full">
            <div *ngFor="let faixa of histograma" class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-sm font-bold text-slate-600 mb-2">{{ faixa.count }} funcionários</span>
              <div class="w-full bg-blue-500 rounded-t-md shadow-sm" [style.height.%]="faixa.percent"></div>
              <span class="text-xs text-slate-500 mt-3 font-semibold">{{ faixa.label }}</span>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>
